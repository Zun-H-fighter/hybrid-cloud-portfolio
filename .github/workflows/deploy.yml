name: Deploy

on:
  push:
    braches: [ main ]

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outpus:
      image: ${{ steps.meta.outputs.image }}
      tag:   ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
        echo "image=ghcr.io/${ github.repository }-app" >> "$GITHUB_OUTPUT"
        echo "tag=sha-$(git rev-parse --short HEAD)"    >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
          ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max


  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ~/hybrid-cloud-portfoilo
            git pull --ff-only
            grep -q '^APP_TAG=' .env || echo 'APP_TAG=latest' >> .env
            sed -i "s|^APP_TAG=.*|APP_TAG=${{ needs.build-push.outpus.tag }}|" .env
            docker compose pull
            docker compose up -d
            docker compose ps